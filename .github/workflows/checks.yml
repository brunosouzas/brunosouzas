name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generated images match their sources
        run: |
          python3 scripts/build_assets.py
          git diff --exit-code -- assets/ || {
            echo "::error::assets/ is out of date: run python3 scripts/build_assets.py and commit the result."
            exit 1
          }
