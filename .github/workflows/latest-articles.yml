name: Latest articles

# Keeps the "Latest articles" cards in README.md and assets/articles/ in step
# with the RSS feed of brunosouzas.com. Commits to main only when they changed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-articles
  cancel-in-progress: false

jobs:
  update:
    # The list belongs to main only, even when the workflow is dispatched from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh the cards from the feed
        run: python3 scripts/update_articles.py

      - name: Commit when the cards changed
        run: |
          git add README.md assets/articles
          if git diff --cached --quiet; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh latest articles"
          git push
