<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="pfa-t pfa-d" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="pfa-t">Cover: Integration patterns in Mule: you already use them, you just don&#x27;t know their names</title>
  <desc id="pfa-d">Illustration. On the left, a white book marked EIP with six pattern icons on its cover. On the right, a blue Mule flow with three components: Scatter-Gather, Choice and For Each. Each component has a yellow name tag hanging from it on a string, and each tag shows the book&#x27;s icon for the pattern the component implements: Scatter-Gather, Content-Based Router and Splitter. The components already carry the book&#x27;s patterns; the tags give them their names.</desc>
