  <title id="hd-t">Bruno Souza: integration, MuleSoft and AI-assisted engineering</title>
  <desc id="hd-d">Header of the GitHub profile, drawn from the brunosouzas.com home banner. Top left, the illustrated avatar (a bearded engineer in a cap with a small AI robot), the name Bruno Souza and the line Integration, MuleSoft, AI-assisted engineering; top right, a yellow pill with the address brunosouzas.com. Below, a web application and a server stack send requests through pipes into an orange integration hub fed by a green AI robot; the result passes three CI/CD checks into a cloud, and an open notebook stands for the articles.</desc>
